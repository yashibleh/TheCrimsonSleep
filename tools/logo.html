<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="logo" width="1200" height="420"></canvas>
<script>
const c = document.getElementById('logo');
const x = c.getContext('2d');
const W = c.width, H = c.height;

function drawTracked(text, cx, y, font, spacing, fill, glow) {
  x.save();
  x.font = font;
  x.textAlign = 'center';
  x.textBaseline = 'alphabetic';
  x.letterSpacing = spacing + 'px';
  if (glow) {
    x.shadowColor = glow.color;
    x.shadowBlur = glow.blur;
  }
  x.fillStyle = fill;
  x.fillText(text, cx, y);
  x.restore();
}

// ---- soft crimson backlight
const halo = x.createRadialGradient(W / 2, 210, 40, W / 2, 210, 520);
halo.addColorStop(0, 'rgba(120,12,20,0.55)');
halo.addColorStop(0.55, 'rgba(80,8,14,0.18)');
halo.addColorStop(1, 'rgba(0,0,0,0)');
x.fillStyle = halo;
x.fillRect(0, 0, W, H);

// ---- small top line
drawTracked('THE', W / 2, 78, '400 23px Georgia, "Times New Roman", serif', 26,
  'rgba(196,166,124,0.80)', { color: 'rgba(200,80,60,0.5)', blur: 14 });

// ---- rules around the small line
x.strokeStyle = 'rgba(176,138,90,0.42)';
x.lineWidth = 1;
x.beginPath();
x.moveTo(W / 2 - 210, 70); x.lineTo(W / 2 - 55, 70);
x.moveTo(W / 2 + 55, 70); x.lineTo(W / 2 + 210, 70);
x.stroke();
x.fillStyle = 'rgba(176,138,90,0.5)';
x.fillRect(W / 2 - 3.5, 66.5, 7, 7);
x.save();
x.translate(W / 2, 70);
x.rotate(Math.PI / 4);
x.strokeStyle = 'rgba(176,138,90,0.7)';
x.strokeRect(-3.5, -3.5, 7, 7);
x.restore();

// ---- main title
const grad = x.createLinearGradient(0, 130, 0, 268);
grad.addColorStop(0, '#f0a9a0');
grad.addColorStop(0.16, '#d23b44');
grad.addColorStop(0.5, '#a8202a');
grad.addColorStop(0.82, '#6d0d16');
grad.addColorStop(1, '#3f050d');
const titleFont = '600 106px Georgia, "Times New Roman", serif';
x.save();
x.font = titleFont;
x.textAlign = 'center';
x.textBaseline = 'alphabetic';
x.letterSpacing = '9px';
x.shadowColor = 'rgba(130,10,20,0.85)';
x.shadowBlur = 38;
x.fillStyle = grad;
x.fillText('CRIMSON SLEEP', W / 2, 250);
x.shadowBlur = 0;
x.strokeStyle = 'rgba(255,210,200,0.10)';
x.lineWidth = 1;
x.strokeText('CRIMSON SLEEP', W / 2, 250);
x.restore();

// ---- letterpress shadow under the word
x.save();
x.globalCompositeOperation = 'multiply';
x.fillStyle = 'rgba(30,0,4,0.5)';
x.font = titleFont;
x.textAlign = 'center';
x.letterSpacing = '9px';
x.fillText('CRIMSON SLEEP', W / 2 + 1.5, 253);
x.restore();

// ---- drips from the letter baseline
let seed = 20261111;
function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
x.save();
for (let i = 0; i < 46; i++) {
  const px = W / 2 - 470 + rnd() * 940;
  const len = 4 + rnd() * rnd() * 96;
  const width = 0.7 + rnd() * 1.9;
  const g2 = x.createLinearGradient(0, 250, 0, 250 + len);
  g2.addColorStop(0, 'rgba(140,16,24,0.85)');
  g2.addColorStop(0.6, 'rgba(96,10,18,0.45)');
  g2.addColorStop(1, 'rgba(60,4,10,0)');
  x.fillStyle = g2;
  x.fillRect(px, 248, width, len);
  x.beginPath();
  x.arc(px + width / 2, 248 + len, width * 0.9, 0, Math.PI * 2);
  x.fillStyle = 'rgba(80,8,14,0.35)';
  x.fill();
}
x.restore();

// ---- subtitle
drawTracked('A QUIET HOUR AT ASHGROVE SANATORIUM', W / 2, 320,
  '400 15px Georgia, "Times New Roman", serif', 7,
  'rgba(178,158,132,0.66)', null);
drawTracked('1917', W / 2, 350, '400 12px Georgia, serif', 14, 'rgba(150,120,96,0.35)', null);

// ---- weathering: fine scratches + specks
x.save();
x.globalCompositeOperation = 'source-atop';
for (let i = 0; i < 2600; i++) {
  const px = rnd() * W, py = rnd() * H;
  const a = rnd() * 0.05;
  x.fillStyle = rnd() > 0.5 ? `rgba(0,0,0,${a})` : `rgba(255,230,210,${a * 0.8})`;
  x.fillRect(px, py, 1 + rnd() * 2, 1);
}
x.restore();

// ---- edge fade so the asset sits into the dark
const vig = x.createRadialGradient(W / 2, 200, 240, W / 2, 200, 640);
vig.addColorStop(0, 'rgba(0,0,0,0)');
vig.addColorStop(1, 'rgba(0,0,0,0.55)');
x.globalCompositeOperation = 'destination-out';
x.fillStyle = vig;
x.fillRect(0, 0, W, H);
x.globalCompositeOperation = 'source-over';

document.title = 'logo ready';
window.__logoReady = true;
</script>
</body>
</html>
